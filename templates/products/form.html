{% extends 'base.html' %}

{% block content %}
<div class="space-y-4">
    <h2 class="text-xl font-bold">{% if product %}Editar{% else %}Novo{% endif %} Produto</h2>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="label">Nome</label>
            <input type="text" name="name" value="{{ product.name|default:'' }}" class="input" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="label">Categoria</label>
                <select name="category" class="input" required>
                    {% for cat in categories %}
                    <option value="{{ cat.0 }}" {% if product.category == cat.0 %}selected{% endif %}>{{ cat.1 }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="label">Tamanho</label>
                <select name="size" class="input">
                    <option value="">Selecione</option>
                    {% for size in sizes %}
                    <option value="{{ size.0 }}" {% if product.size == size.0 %}selected{% endif %}>{{ size.1 }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="label">Cor</label>
                <input type="text" name="color" value="{{ product.color|default:'' }}" class="input">
            </div>
            <div>
                <label class="label">Estoque</label>
                <input type="number" name="stock" value="{{ product.stock|default:0 }}" class="input">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="label">Custo (R$)</label>
                <input type="number" step="0.01" name="cost" value="{{ product.cost|default:0 }}" class="input" id="costInput" oninput="calculatePrice()">
                <p class="text-xs text-gray-500 mt-1">Margem: {{ profit_margin|default:5 }}%</p>
            </div>
            <div>
                <label class="label">Preço venda (R$)</label>
                <input type="number" step="0.01" name="price" value="{{ product.price|default:'' }}" class="input" id="priceInput" required>
</div>
        </div>

        <div>
            <label class="label">Foto</label>
            <input type="file" name="image" accept="image/*" class="input">
            {% if product.image %}
            <img src="{{ product.image.url }}" class="w-20 h-20 object-cover rounded-xl mt-2">
            {% endif %}
        </div>

        <div class="flex gap-2">
            <a href="{% url 'products_list' %}" class="btn btn-secondary flex-1">Cancelar</a>
            <button type="submit" class="btn btn-primary flex-1">Salvar</button>
        </div>
    </form>
</div>

<script>
const PROFIT_MARGIN = {{ profit_margin|default:5 }};

function calculatePrice() {
    const cost = parseFloat(document.getElementById('costInput').value) || 0;
    const priceInput = document.getElementById('priceInput');
    
    if (cost > 0) {
        const sellingPrice = cost * (1 + (PROFIT_MARGIN / 100));
        priceInput.value = sellingPrice.toFixed(2);
    }
}
</script>
{% endblock %}
